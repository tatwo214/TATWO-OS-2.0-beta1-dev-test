[package]
name = "tatwo-spotify"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "TATWO OS 內建的 Spotify Connect 裝置（librespot）"

[dependencies]
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
